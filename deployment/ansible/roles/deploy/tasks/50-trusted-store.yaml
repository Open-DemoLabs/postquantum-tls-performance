- name: get sha256 for root CAs
  ansible.builtin.command:
    cmd: "openssl x509 -in /etc/pki/{{ item.name }}-CA/certs/{{ item.name }}-ca.cert.pem -noout -fingerprint -sha256"
  loop: "{{ root_ca }}"
  register: root_ca_fp
  changed_when: false

- name: copy every root CA certificate with unique name
  ansible.builtin.copy:
    src: "/etc/pki/{{ item.item.name }}-CA/certs/{{ item.item.name }}-ca.cert.pem"
    remote_src: true
    dest: >-
      /etc/pki/ca-trust/source/anchors/ca-{{
        item.stdout | regex_replace('^.*Fingerprint=', '') | regex_replace(':', '')
      }}.pem
    owner: root
    group: root
    mode: "0644"
  loop: "{{ root_ca_fp.results }}"
  notify: actualizar trust store

- name: get sha256 for regular CAs
  ansible.builtin.command:
    cmd: "openssl x509 -in /etc/pki/{{ item.name }}-CA/certs/{{ item.name }}.cert.pem -noout -fingerprint -sha256"
  loop: "{{ regular_ca }}"
  register: regular_ca_fp
  changed_when: false

- name: copy every regular CA certificate with unique name
  ansible.builtin.copy:
    src: "/etc/pki/{{ item.item.name }}-CA/certs/{{ item.item.name }}.cert.pem"
    remote_src: true
    dest: >-
      /etc/pki/ca-trust/source/anchors/ca-{{
        item.stdout | regex_replace('^.*Fingerprint=', '') | regex_replace(':', '')
      }}.pem
    owner: root
    group: root
    mode: "0644"
  loop: "{{ regular_ca_fp.results }}"
  notify: actualizar trust store