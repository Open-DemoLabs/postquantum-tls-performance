- name: update trust store
  ansible.builtin.command:
    cmd: /usr/bin/update-ca-trust extract
  become: true

- name: reboot to apply crypto policy
  ansible.builtin.reboot:
    msg: "Rebooting to apply crypto policy {{ cp_target }}"
    reboot_timeout: 10 
  become: true
