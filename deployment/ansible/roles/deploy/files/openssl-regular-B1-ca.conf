####################################################################
# OpenSSL 3.5 - CA "regular-B1" (intermediate, signed by root-A2)
# B1 (Cat 3): PQC KEX (ML-KEM-768, negotiated in handshake)
#            + PQC signature (ML-DSA-65)
#
# Hierarchy:  root-B1 (root)  ->  regular-B1 (this CA)  ->  server leaf
#   * This CA is SIGNED BY root-A2 (use root's config + -extensions v3_intermediate_ca).
#   * This CA SIGNS the server (use this config; default x509_extensions = server_cert).
####################################################################

[ default ]
ca_name                 = regular-B1-CA
base_dir                = /etc/pki/regular-B1-CA

####################################################################
[ ca ]
default_ca              = regular-B1-CA

[ regular-B1-CA ]
dir                     = /etc/pki/regular-B1-CA
certs                   = $dir/certs
crl_dir                 = $dir/crl
new_certs_dir           = $dir/newcerts
database                = $dir/index.txt
serial                  = $dir/serial
crlnumber               = $dir/crlnumber

private_key             = $dir/private/regular-B1.key.pem
certificate             = $dir/certs/regular-B1.cert.pem

crl                     = $dir/crl/regular-B1.crl.pem
crl_extensions          = crl_ext
default_crl_days        = 30

# Mandatory for ML-DSA: pure signature scheme, hashing is intrinsic
default_md              = null

default_days            = 365
preserve                = no
policy                  = policy_loose
email_in_dn             = no
rand_serial             = yes
unique_subject          = no
copy_extensions         = copy
name_opt                = ca_default
cert_opt                = ca_default

# Default profile this CA applies when signing a leaf (the SERVER).
# Correct here: this intermediate signs servers directly.
# Sign leaves with an explicit profile too:  -extensions server_cert | client_cert
x509_extensions         = server_cert

####################################################################
[ policy_strict ]
countryName             = match
stateOrProvinceName     = match
organizationName        = match
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

[ policy_loose ]
countryName             = optional
stateOrProvinceName     = optional
localityName            = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

####################################################################
# CSR profile for THIS intermediate's own request (openssl req -new).
# A CSR must NOT carry CA extensions: the issuer (root-B1) decides them at
# signing time via -extensions v3_intermediate_ca. So no x509_extensions here.
[ req ]
default_md              = null
distinguished_name      = req_distinguished_name
string_mask             = utf8only
utf8                    = yes
prompt                  = no

[ req_distinguished_name ]
C                       = ES
ST                      = Castilla y Leon
L                       = Salamanca
O                       = PQC vs Classical
OU                      = PKI
CN                      = regular-B1-CA

####################################################################
# Server (leaf) profile — what this intermediate stamps onto server certs.
[ server_cert ]
basicConstraints        = critical, CA:FALSE
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid
keyUsage                = critical, digitalSignature
extendedKeyUsage        = serverAuth
crlDistributionPoints   = URI:http://pki.example.net/crl/regular-B1.crl
authorityInfoAccess     = OCSP;URI:http://ocsp.example.net/

[ client_cert ]
basicConstraints        = critical, CA:FALSE
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid
keyUsage                = critical, digitalSignature
extendedKeyUsage        = clientAuth

####################################################################
[ crl_ext ]
authorityKeyIdentifier  = keyid:always

####################################################################
[ mtls_client ]
basicConstraints       = critical,CA:FALSE
keyUsage               = critical,digitalSignature
extendedKeyUsage       = clientAuth
subjectKeyIdentifier   = hash
authorityKeyIdentifier = keyid,issuer