####################################################################
# OpenSSL 3.5 - CA "root-C2"
# C2 (Cat 5): KEX secp521r1 (P-521, negotiated in handshake)
#                    + signature ECDSA P-521 + SHA-512
# Target: RHEL 10.2, TLS 1.3 only
####################################################################

[ default ]
ca_name                 = root-C2-CA
base_dir                = /etc/pki/root-C2-CA

####################################################################
[ ca ]
default_ca              = root-C2-CA

[ root-C2-CA ]
dir                     = /etc/pki/root-C2-CA
certs                   = $dir/certs
crl_dir                 = $dir/crl
new_certs_dir           = $dir/newcerts
database                = $dir/index.txt
serial                  = $dir/serial
crlnumber               = $dir/crlnumber

private_key             = $dir/private/root-C2.key.pem
certificate             = $dir/certs/root-C2-ca.cert.pem

crl                     = $dir/crl/root-C2.crl.pem
crl_extensions          = crl_ext
default_crl_days        = 30

default_md              = sha512
default_days            = 365
preserve                = no
policy                  = policy_loose
email_in_dn             = no
rand_serial             = yes
unique_subject          = no
copy_extensions         = copy
name_opt                = ca_default
cert_opt                = ca_default
x509_extensions         = server_cert

####################################################################
[ policy_strict ]
countryName             = match
stateOrProvinceName     = match
organizationName        = match
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

[ policy_loose ]
countryName             = optional
stateOrProvinceName     = optional
localityName            = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

####################################################################
[ req ]
default_md              = sha512
distinguished_name      = req_distinguished_name
string_mask             = utf8only
utf8                    = yes
prompt                  = no
x509_extensions         = v3_ca

[ req_distinguished_name ]
C                       = ES
ST                      = Castilla y Leon
L                       = Salamanca
O                       = PQC vs Classical
OU                      = PKI
CN                      = C2 Root CA

####################################################################
[ v3_ca ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always
basicConstraints        = critical, CA:true
keyUsage                = critical, digitalSignature, cRLSign, keyCertSign

[ v3_intermediate_ca ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always
basicConstraints        = critical, CA:true, pathlen:0
keyUsage                = critical, digitalSignature, cRLSign, keyCertSign

####################################################################
[ server_cert ]
basicConstraints        = critical, CA:FALSE
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid
keyUsage                = critical, digitalSignature
extendedKeyUsage        = serverAuth
crlDistributionPoints   = URI:http://pki.example.net/crl/C2-ca.crl
authorityInfoAccess     = OCSP;URI:http://ocsp.example.net/

[ client_cert ]
basicConstraints        = critical, CA:FALSE
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid
keyUsage                = critical, digitalSignature
extendedKeyUsage        = clientAuth

####################################################################
[ crl_ext ]
authorityKeyIdentifier  = keyid:always