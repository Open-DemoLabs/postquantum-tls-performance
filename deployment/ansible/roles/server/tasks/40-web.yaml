- name: create apache vhost config from template per scenario
  ansible.builtin.template:
    src: "{{ item.virtual_host }}.j2"
    dest: "/etc/httpd/conf.d/{{ item.virtual_host }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ regular_ca }}"

- name: generate private key for virtual hosts
  ansible.builtin.command:
    cmd: >
      /usr/bin/openssl genpkey {{ item.openssl_genkey_virtualhost }} -out /etc/pki/{{ item.name }}-CA/private/virtualhost.key.pem
    creates: "/etc/pki/{{ item.name }}/private/virtualhost.key.pem"
  loop: "{{ regular_ca }}"  

- name: enforce restrictive permissions on private keys for virtual hosts
  ansible.builtin.file:
    path: "/etc/pki/{{ item.name }}-CA/private/virtualhost.key.pem"
    mode: '0400'
    owner: root
    group: root  
  loop: "{{ regular_ca }}"  

- name: generate csr for virtual hosts
  ansible.builtin.command:
    cmd: >
      /usr/bin/openssl req -new -config /etc/pki/{{ item.name }}-CA/openssl-{{ item.name }}-ca.conf
        -key /etc/pki/{{ item.name }}-CA/private/virtualhost.key.pem
        -subj "/C={{ ca_C }}/ST={{ca_ST}}/L={{ ca_L }}/O={{ca_O}}/OU={{ item.ca_ou }}/CN={{ webserver }}"
        -addext "subjectAltName=DNS:{{ webserver }}"
        -out /etc/pki/{{ item.name }}-CA/certs/virtualhost.csr.pem -passin env:CA_KEY_PASS
    creates: "/etc/pki/{{ item.name }}-CA/certs/virtualhost.csr.pem"
  environment:
    CA_KEY_PASS: "{{ passphrase }}" 
  loop: "{{ regular_ca }}"

- name: sign csr for virtual hosts with root CAs
  ansible.builtin.command:
    cmd: >
      /usr/bin/openssl ca -batch -config /etc/pki/{{ item.name }}-CA/openssl-{{ item.name }}-ca.conf -extensions server_cert
        -days {{ ca_days }} -notext -in /etc/pki/{{ item.name }}-CA/certs/virtualhost.csr.pem
        -out /etc/pki/{{ item.name }}-CA/certs/virtualhost.cert.pem -passin env:CA_KEY_PASS
    creates: "/etc/pki/{{ item.name }}-CA/certs/virtualhost.cert.pem"
  environment:
    CA_KEY_PASS: "{{ passphrase }}"      
  loop: "{{ regular_ca }}" 

- name: restore selinux context in /etc/pki
  ansible.builtin.file:
    path: /etc/pki
    recurse: yes
    setype: _default
    seuser: system_u

- name: create directories for apache virtual hosts document roots
  ansible.builtin.file:
    path: "{{ item.document_root }}"
    state: directory
    owner: root
    group: root
    setype: httpd_sys_content_t
    mode: '0755'
  loop:  "{{ regular_ca }}"

- name: copy index.html to virtual hosts document roots
  ansible.builtin.copy:
    src: index.html
    dest: "{{ item.document_root }}/index.html"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ regular_ca }}"  

- name: label custom ports for httpd in SELinux
  community.general.seport:
    ports: "{{ item.https_port }}"
    proto: tcp
    setype: http_port_t
    state: present
  loop: "{{ regular_ca }}"

- name: open custom httpd ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item.https_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ regular_ca }}"

- name: configure mod_ssl cache to avoid TLS handshake serialization (SSLSessionCache)
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf 
    regexp: '^\s*{{ item.pattern }}\s+.*'
    line: '{{ item.configuration }}'
    state: present
    backup: yes
  loop:
    - { pattern: 'SSLSessionCache', configuration: 'SSLSessionCache none' }

- name: configure mod_ssl cache to avoid TLS handshake serialization (SSLSessionTickets)
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf 
    insertafter: "^SSLSessionCacheTimeout"
    line: "SSLSessionTickets off"
    state: present
    backup: yes

- name: enabling service httpd and ensuring it is not masked
  ansible.builtin.systemd_service:
    name: httpd
    enabled: true
    masked: no
    state: started