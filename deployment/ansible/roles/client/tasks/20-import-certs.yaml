- name: import ca certificates to client host
  ansible.builtin.copy:
    src: "{{ export_cas_certs_dir }}/"
    dest: /etc/pki/ca-trust/source/anchors/
    owner: root
    group: root
    mode: "0644"
  notify: update trust store