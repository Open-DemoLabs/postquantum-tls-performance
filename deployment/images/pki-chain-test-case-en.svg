<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="660" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">
    Test-case trust chain
  </text>
  <text x="450" y="82" text-anchor="middle" font-size="15" fill="#64748b">
    XX = scenario (A1, A2, B1, C1, C2) — each with its own algorithm (ML-DSA, EC/ECDSA, SLH-DSA)
  </text>

  <!-- ===================== Tier 1: Root CA ===================== -->
  <g filter="url(#shadow)">
    <rect x="270" y="120" width="360" height="92" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  </g>
  <rect x="270" y="120" width="8" height="92" rx="4" fill="#b91c1c"/>
  <text x="450" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">root-XX-CA</text>
  <text x="450" y="176" text-anchor="middle" font-size="13.5" fill="#475569">Root CA — self-signed</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#94a3b8">trust anchor in the RHEL trust store</text>

  <!-- Self-signed loop -->
  <path d="M 630 140 C 700 128, 700 204, 634 194" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="712" y="170" text-anchor="start" font-size="11.5" fill="#94a3b8">self-</text>
  <text x="712" y="185" text-anchor="start" font-size="11.5" fill="#94a3b8">signed</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="212" x2="450" y2="286" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="235" width="72" height="26" rx="13" fill="#e2e8f0"/>
  <text x="506" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">signs</text>

  <!-- ===================== Tier 2: Intermediate CA ===================== -->
  <g filter="url(#shadow)">
    <rect x="270" y="292" width="360" height="92" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  </g>
  <rect x="270" y="292" width="8" height="92" rx="4" fill="#b45309"/>
  <text x="450" y="324" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">regular-XX-CA</text>
  <text x="450" y="348" text-anchor="middle" font-size="13.5" fill="#475569">Intermediate / issuing CA</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#94a3b8">signed by root-XX-CA</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="384" x2="450" y2="458" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="470" y="407" width="72" height="26" rx="13" fill="#e2e8f0"/>
  <text x="506" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">signs</text>

  <!-- ===================== Tier 3: End-entity (VirtualHost) ===================== -->
  <g filter="url(#shadow)">
    <rect x="270" y="464" width="360" height="96" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  </g>
  <rect x="270" y="464" width="8" height="96" rx="4" fill="#0f766e"/>
  <text x="450" y="496" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">virtualhost-XX</text>
  <text x="450" y="520" text-anchor="middle" font-size="13.5" fill="#475569">Server certificate (end-entity)</text>
  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#94a3b8">Apache (httpd) VirtualHost — TLS 1.3</text>

  <!-- Footer note -->
  <text x="450" y="610" text-anchor="middle" font-size="12.5" fill="#64748b">
    Apache presents:  virtualhost-XX  +  chain  regular-XX-CA
  </text>
  <text x="450" y="630" text-anchor="middle" font-size="12.5" fill="#64748b">
    The client validates up to the  root-XX-CA  anchor in the trust store
  </text>
</svg>
